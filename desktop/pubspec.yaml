name: school_manager
description: د ښوونځي او مدرسې د کنټرول بشپړ سیسټم — ډیسکټاپ.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── ډیټابیس ─────────────────────────────────────────────
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  sqlite3: ^2.4.6

  # ── حالت او مسیریابي ────────────────────────────────────
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # ── فایل سیسټم ──────────────────────────────────────────
  path_provider: ^2.1.4
  path: ^1.9.0
  file_selector: ^1.0.3

  # ── ډیسکټاپ وینډو ───────────────────────────────────────
  window_manager: ^0.4.2

  # ── UI ──────────────────────────────────────────────────
  fl_chart: ^0.69.0

  # ── نور ─────────────────────────────────────────────────
  intl: ^0.19.0
  shamsi_date: ^1.0.4
  crypto: ^3.0.5
  collection: ^1.18.0
  qr_flutter: ^4.1.0
  pdf: ^3.13.0
  printing: ^5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.12

flutter:
  uses-material-design: true

  # فونټ له پروګرام سره یو ځای بسته کېږي — نه له انټرنټه راښکل کېږي.
  # دا د بې‌انټرنټه ښوونځي لپاره شرط دی.
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
