name: Build School Manager

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# د Flutter نسخه **ټاکل شوې** ده، نه `stable`.
#
# ولې؟ ځکه چې `stable` هره څو اونۍ بدلېږي او د Flutter د API بدلونونه
# کوډ ماتوي — بېلګه: په ۳.۳۲ کې `CardTheme` د `CardThemeData` په نوم
# شو. که نسخه ونه تړل شي، یوه ورځ به build پرته له دې چې موږ څه بدل
# کړي وي، سور شي. د پورته کولو پرېکړه باید زموږ وي، نه د تصادف.
env:
  FLUTTER_VERSION: "3.29.0"
  DESKTOP_DIR: desktop
  MOBILE_DIR: mobile

# د لاسلیک مواد له Secrets څخه لوستل کېږي — هېڅکله په ګټ کې نه ساتل کېږي.
#   GitHub → Settings → Secrets and variables → Actions
#     WINDOWS_PFX_BASE64  – د .pfx فایل base64
#     WINDOWS_PFX_PASS    – د هغه پاسورډ
#     ANDROID_KEYSTORE_BASE64 / ANDROID_STORE_PASS – د اندروید لپاره
# که کوم secret نه وي، هغه پلیټ‌فارم **بې‌لاسلیکه** جوړېږي (بیا هم کار کوي).

jobs:
  # ---------------------------------------------------------------------------
  # ازموینې — د هر build دروازه
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    outputs:
      has_mobile: ${{ steps.probe.outputs.has_mobile }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Check whether the mobile app exists yet
        id: probe
        run: |
          if [ -f "$MOBILE_DIR/pubspec.yaml" ]; then
            echo "has_mobile=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_mobile=false" >> "$GITHUB_OUTPUT"
            echo "::notice::د موبایل اپ (mobile/) لا نه دی جوړ شوی — د APK دنده پرېښودل کېږي."
          fi

      - run: flutter pub get
        working-directory: ${{ env.DESKTOP_DIR }}

      # د drift تولید شوی کوډ په ګټ کې ساتل شوی، نو `build_runner` دلته
      # اړین نه دی. خو دا ګام ډاډ ورکوي چې تولید شوی کوډ له سکیما سره
      # همغږی دی — که څوک سکیما بدله کړي او تولید هېر کړي، دلته نیول کېږي.
      - name: Verify generated code is up to date
        working-directory: ${{ env.DESKTOP_DIR }}
        run: |
          dart run build_runner build
          if ! git diff --quiet -- lib/data/db/database.g.dart; then
            echo "::error::database.g.dart له سکیما سره سم نه دی."
            echo "ځایي ماشین کې دا وځغلوئ: dart run build_runner build"
            git diff --stat -- lib/data/db/database.g.dart
            exit 1
          fi

      - name: Analyze
        working-directory: ${{ env.DESKTOP_DIR }}
        run: flutter analyze

      # د عکسونو ازموینه پرېښودل کېږي — د گولډن عکس پرتله د ماشین د
      # فونټ رینډر پورې اړه لري، نو په بل ماشین کې بې‌ځایه سره کېږي.
      - name: Test
        working-directory: ${{ env.DESKTOP_DIR }}
        run: flutter test --exclude-tags screenshots

  # ---------------------------------------------------------------------------
  # ویندوز — .exe، لاسلیک شوی، zip شوی
  # ---------------------------------------------------------------------------
  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # `flutter create` دلته نه ځغلي: د `windows/` پوښۍ په ګټ کې ده او
      # زموږ خپلې سمونې پکې دي. که وځغلي، هغه به بېرته پر تلواله راولي.
      - name: Diagnose toolchain
        working-directory: ${{ env.DESKTOP_DIR }}
        run: flutter doctor -v

      - run: flutter pub get
        working-directory: ${{ env.DESKTOP_DIR }}

      - name: Build Windows (release)
        working-directory: ${{ env.DESKTOP_DIR }}
        run: flutter build windows --release

      - name: Sign the executable (if the certificate secret is present)
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        env:
          PFX_B64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.WINDOWS_PFX_PASS }}
        run: |
          $exe = "build/windows/x64/runner/Release/school_manager.exe"
          if (-not (Test-Path $exe)) { throw "Executable not found: $exe" }
          if ([string]::IsNullOrEmpty($env:PFX_B64) -or [string]::IsNullOrEmpty($env:PFX_PASS)) {
            Write-Host "::warning::No WINDOWS_PFX_BASE64 secret - the build is unsigned. Windows SmartScreen will warn on first run."
          } else {
            [IO.File]::WriteAllBytes("win.pfx", [Convert]::FromBase64String($env:PFX_B64))
            $pw = ConvertTo-SecureString -String $env:PFX_PASS -Force -AsPlainText
            $cert = Get-PfxCertificate -FilePath "win.pfx" -Password $pw
            Set-AuthenticodeSignature -FilePath $exe -Certificate $cert `
              -HashAlgorithm SHA256 -TimestampServer "http://timestamp.digicert.com"
            Get-AuthenticodeSignature $exe | Format-List
            Remove-Item "win.pfx" -Force
          }

      # ټوله پوښۍ بسته کېږي، نه یوازې .exe — Flutter د DLL فایلونو او
      # د `data/` پوښۍ سره ځغلي. یوازې .exe به ونه چلېږي.
      - name: Zip the Windows build
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath ../SchoolManager-Windows.zip -Force
          Get-Item ../SchoolManager-Windows.zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: school-manager-windows
          path: SchoolManager-Windows.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # اندروید — د مدیر او والدینو اپ (څلورم پړاو)
  #
  # دا دنده اوس **پرېښودل کېږي** ځکه چې د `mobile/` پروژه لا نه ده جوړه
  # شوې. کله چې جوړه شي، پخپله پیلېږي — دلته څه بدلولو ته اړتیا نشته.
  # ---------------------------------------------------------------------------
  android:
    needs: test
    if: needs.test.outputs.has_mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: ${{ env.MOBILE_DIR }}

      - run: flutter analyze
        working-directory: ${{ env.MOBILE_DIR }}

      - run: flutter test
        working-directory: ${{ env.MOBILE_DIR }}

      # یوازې arm64 — تر یونیورسل APK ډېر کوچنی دی او له ~۲۰۱۹ راهیسې
      # ټول فونونه پوښي.
      - name: Build compact APK (arm64)
        working-directory: ${{ env.MOBILE_DIR }}
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --obfuscate --split-debug-info=build/symbols

      - name: Sign the APK (falls back to the Flutter build if no keystore)
        working-directory: ${{ env.MOBILE_DIR }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_STORE_PASS }}
        run: |
          set -e
          mkdir -p ../out
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASS" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.p12
            SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
            BT="$(ls -d "$SDK"/build-tools/*/ | sort -V | tail -1)"
            "${BT}apksigner" sign \
              --ks release.p12 --ks-type PKCS12 \
              --ks-pass "pass:${STORE_PASS}" --key-pass "pass:${STORE_PASS}" \
              --out ../out/SchoolManager.apk "$APK"
            "${BT}apksigner" verify --print-certs ../out/SchoolManager.apk
            rm -f release.p12
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret - shipping the default-signed APK."
            cp "$APK" ../out/SchoolManager.apk
          fi
          ls -lh ../out/SchoolManager.apk

      - uses: actions/upload-artifact@v4
        with:
          name: school-manager-android
          path: out/SchoolManager.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # د نسخې په ټګ (vX.Y.Z) کې د ډاونلوډ وړ فایلونه خپروي
  # ---------------------------------------------------------------------------
  release:
    needs: [windows, android]
    # `always()` ځکه پکار ده چې د اندروید دنده پرېښودل کېږي، او پرته له
    # دې به بشپړ release هم پرېښودل شوی وګڼل شي.
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
